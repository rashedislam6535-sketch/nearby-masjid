<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Islamic Emerald to Deep Forest -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#043a2c"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.65"/>

  <!-- Star & Crescent Moon at Top -->
  <g transform="translate(256, 120)" filter="url(#glow)">
    <!-- Crescent Moon -->
    <path d="M -8 -36 A 38 38 0 1 0 32 30 A 30 30 0 1 1 -8 -36 Z" fill="url(#goldGrad)"/>
    <!-- Star -->
    <polygon points="12,-16 16,-2 28,-2 18,6 22,20 12,12 2,20 6,6 -4,-2 8,-2" fill="#fef08a"/>
  </g>

  <!-- Mosque Central Dome -->
  <path d="M 256 160 C 200 210, 160 250, 160 330 L 352 330 C 352 250, 312 210, 256 160 Z" fill="url(#goldGrad)"/>

  <!-- Side Minaret Domes -->
  <!-- Left Minaret -->
  <path d="M 104 250 C 90 270, 80 285, 80 320 L 128 320 C 128 285, 118 270, 104 250 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Left Minaret Pillar -->
  <rect x="86" y="320" width="36" height="110" rx="4" fill="url(#goldGrad)" opacity="0.85"/>
  <!-- Left Spire -->
  <line x1="104" y1="230" x2="104" y2="250" stroke="#fef08a" stroke-width="4"/>
  <circle cx="104" cy="226" r="4" fill="#fef08a"/>

  <!-- Right Minaret -->
  <path d="M 408 250 C 394 270, 384 285, 384 320 L 432 320 C 432 285, 422 270, 408 250 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Right Minaret Pillar -->
  <rect x="390" y="320" width="36" height="110" rx="4" fill="url(#goldGrad)" opacity="0.85"/>
  <!-- Right Spire -->
  <line x1="408" y1="230" x2="408" y2="250" stroke="#fef08a" stroke-width="4"/>
  <circle cx="408" cy="226" r="4" fill="#fef08a"/>

  <!-- Mosque Main Base & Walls -->
  <rect x="136" y="330" width="240" height="100" fill="url(#goldGrad)"/>

  <!-- Islamic Arched Doorway (Negative Space Emerald) -->
  <path d="M 216 430 L 216 360 C 216 335, 234 320, 256 305 C 278 320, 296 335, 296 360 L 296 430 Z" fill="#042f2e"/>

  <!-- Small Arch Windows on Sides -->
  <path d="M 164 400 L 164 365 C 164 350, 172 342, 180 335 C 188 342, 196 350, 196 365 L 196 400 Z" fill="#042f2e" opacity="0.8"/>
  <path d="M 316 400 L 316 365 C 316 350, 324 342, 332 335 C 340 342, 348 350, 348 365 L 348 400 Z" fill="#042f2e" opacity="0.8"/>

  <!-- Horizontal Platform Foundation -->
  <rect x="64" y="430" width="384" height="18" rx="8" fill="#fef08a"/>
</svg>
